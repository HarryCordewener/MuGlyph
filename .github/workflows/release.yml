name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: publish (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, rid: linux-x64, profile: linux-x64 }
          - { os: windows-latest, rid: win-x64, profile: win-x64 }

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish single-file
        shell: bash
        run: >
          dotnet publish src/MuClient.Tui/MuClient.Tui.csproj
          -p:PublishProfile=${{ matrix.profile }}
          -o publish/${{ matrix.rid }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf ../../muglyph-${{ matrix.rid }}.tar.gz muglyph

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          7z a ../../muglyph-${{ matrix.rid }}.zip muglyph.exe

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: muglyph-${{ matrix.rid }}
          path: muglyph-${{ matrix.rid }}.*

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: muglyph-${{ matrix.rid }}.*
